<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#100d19">
<title>Bakeneko AI</title>
<style>
:root {
  color-scheme: dark;
  --bg: #100d19;
  --panel: #191526;
  --line: #302740;
  --purple: #b18cff;
  --text: #f6f0ff;
  --muted: #b7abc9;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px system-ui, sans-serif; min-height: 100vh;
  display: flex; justify-content: center;
}
.app {
  width: 100%; max-width: 850px; min-height: 100vh;
  display: flex; flex-direction: column;
}
header {
  padding: 17px; display: flex; align-items: center;
  gap: 12px; border-bottom: 1px solid var(--line);
  background: #151120; position: sticky; top: 0;
}
.cat {
  width: 46px; height: 46px; border-radius: 16px;
  background: linear-gradient(145deg,#a77aff,#49276d);
  display: grid; place-items: center; font-size: 27px;
}
h1 { font-size: 19px; margin: 0; }
.sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
button {
  border: 1px solid var(--line); border-radius: 12px;
  background: var(--panel); color: var(--text);
  padding: 10px 12px; cursor: pointer; font: inherit;
}
button:disabled { opacity: .5; }
#clear { margin-left: auto; font-size: 12px; }
#messages {
  flex: 1; padding: 20px 14px; display: flex;
  flex-direction: column; gap: 15px; overflow-wrap: anywhere;
}
.msg { max-width: 88%; padding: 12px 14px; border-radius: 17px; line-height: 1.55; white-space: pre-wrap; }
.bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); }
.user { align-self: flex-end; background: #55358a; }
.label { color: var(--purple); font-size: 11px; margin-bottom: 5px; }
.welcome { text-align: center; color: var(--muted); padding: 40px 12px; }
.welcome .big { font-size: 50px; }
form { padding: 12px; border-top: 1px solid var(--line); background: #151120; }
.entry { display: flex; gap: 8px; align-items: end; }
textarea {
  flex: 1; min-width: 0; resize: none; max-height: 140px;
  padding: 13px; border-radius: 14px; border: 1px solid var(--line);
  background: #0f0c17; color: var(--text); font: inherit;
}
#send { background: var(--purple); color: #180f24; border: 0; font-weight: 700; }
.tools { display: flex; gap: 8px; padding-top: 9px; }
.tools button { font-size: 12px; padding: 7px 10px; }
#status { color: var(--muted); font-size: 12px; padding: 0 14px 8px; }
footer { text-align: center; font-size: 11px; color: var(--muted); padding: 10px; }
@media (min-width: 600px) {
  body { padding: 18px; }
  .app { min-height: calc(100vh - 36px); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="cat">🐈‍⬛</div>
  <div><h1>Bakeneko AI</h1><div class="sub">Your curious digital companion</div></div>
  <button id="clear">Clear chat</button>
</header>

<main id="messages" aria-live="polite">
  <div class="welcome" id="welcome">
    <div class="big">🐈‍⬛</div>
    <h2>Well, well… you're here.</h2>
    <p>Ask me something, human. Try not to be boring.</p>
  </div>
</main>
<div id="status"></div>
<form id="form">
  <div class="entry">
    <textarea id="input" rows="1" maxlength="4000" placeholder="Message Bakeneko…" aria-label="Message"></textarea>
    <button id="send" type="submit">Send</button>
  </div>
  <div class="tools">
    <button type="button" id="mic">🎙 Voice input</button>
    <button type="button" id="speak">🔊 Voice replies: off</button>
  </div>
</form>
<footer>Chat is saved on this device. AI requests require internet access.</footer>
</div>

<script>
const messages = document.querySelector("#messages");
const form = document.querySelector("#form");
const input = document.querySelector("#input");
const statusLine = document.querySelector("#status");
const send = document.querySelector("#send");
let voiceReplies = false;
let busy = false;

function addMessage(role, text) {
  document.querySelector("#welcome")?.remove();
  const box = document.createElement("div");
  box.className = "msg " + (role === "user" ? "user" : "bot");
  const label = document.createElement("div");
  label.className = "label";
  label.textContent = role === "user" ? "YOU" : "BAKENEKO";
  const body = document.createElement("div");
  body.textContent = text;
  box.append(label, body);
  messages.append(box);
  messages.scrollTop = messages.scrollHeight;
}

async function loadHistory() {
  try {
    const response = await fetch("/api/history");
    const data = await response.json();
    for (const item of data.history || []) addMessage(item.role, item.text);
  } catch {}
}

form.addEventListener("submit", async event => {
  event.preventDefault();
  const message = input.value.trim();
  if (!message || busy) return;
  addMessage("user", message);
  input.value = "";
  busy = true;
  send.disabled = true;
  statusLine.textContent = "Bakeneko is thinking…";

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message })
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Request failed");
    addMessage("model", data.answer);
    if (voiceReplies && "speechSynthesis" in window) {
      speechSynthesis.cancel();
      speechSynthesis.speak(new SpeechSynthesisUtterance(data.answer));
    }
  } catch (error) {
    addMessage("model", "Oops: " + error.message);
  } finally {
    busy = false;
    send.disabled = false;
    statusLine.textContent = "";
    input.focus();
  }
});

document.querySelector("#clear").addEventListener("click", async () => {
  if (!confirm("Delete the saved chat on this server?")) return;
  try {
    await fetch("/api/clear", { method: "POST" });
    messages.replaceChildren();
    const welcome = document.createElement("div");
    welcome.className = "welcome";
    welcome.innerHTML = '<div class="big">🐈‍⬛</div><h2>Fresh page, human.</h2><p>What now?</p>';
    welcome.id = "welcome";
    messages.append(welcome);
    if ("speechSynthesis" in window) speechSynthesis.cancel();
  } catch {
    alert("Couldn't clear history.");
  }
});

document.querySelector("#speak").addEventListener("click", () => {
  voiceReplies = !voiceReplies;
  document.querySelector("#speak").textContent =
    voiceReplies ? "🔊 Voice replies: on" : "🔊 Voice replies: off";
  if (!voiceReplies && "speechSynthesis" in window) speechSynthesis.cancel();
});

document.querySelector("#mic").addEventListener("click", () => {
  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Recognition) {
    alert("Speech recognition isn't supported in this browser. Try Chrome or use keyboard input.");
    return;
  }
  const recognition = new Recognition();
  recognition.lang = navigator.language || "en-US";
  recognition.interimResults = false;
  recognition.onresult = event => {
    input.value = event.results[0][0].transcript;
    input.focus();
  };
  recognition.onerror = event => {
    statusLine.textContent = "Microphone: " + event.error;
  };
  recognition.start();
});

input.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    form.requestSubmit();
  }
});

loadHistory();
</script>
</body>
</html>
